<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0d10">
<title>for you ♡</title>
<style>
:root{--bg:#0d0d10;--card:#17171c;--text:#f7f7f8;--muted:#a7a7b1;--line:rgba(255,255,255,.08);--pink:#ff6fb5;--violet:#9d7bff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,rgba(255,111,181,.16),transparent 34%),radial-gradient(circle at 90% 88%,rgba(157,123,255,.15),transparent 34%),var(--bg);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:28px 28px}
.page{width:min(680px,100%);min-height:100vh;margin:0 auto;padding:30px 18px 38px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;width:max-content;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);color:#d8d8df;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 0 18px rgba(255,111,181,.7)}
h1{margin:24px 0 10px;font-size:clamp(42px,11vw,76px);line-height:.94;letter-spacing:-.055em;font-weight:850}
.accent{background:linear-gradient(90deg,#fff 0%,#ff9ccc 44%,#b6a4ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;max-width:520px;color:var(--muted);font-size:15px;line-height:1.65}
.choices{display:grid;gap:14px;margin-top:34px}
.choice{position:relative;display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:118px;padding:22px 22px 22px 24px;color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:25px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025)),var(--card);box-shadow:0 14px 40px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.055);overflow:hidden;isolation:isolate;transition:.22s ease;-webkit-tap-highlight-color:transparent}
.choice:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-55px;top:-70px;opacity:.18;z-index:-1}
.lucario:before{background:radial-gradient(circle,var(--pink),transparent 68%)}
.taeyeon:before{background:radial-gradient(circle,var(--violet),transparent 68%)}
.choice:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.15);box-shadow:0 20px 46px rgba(0,0,0,.3)}
.choice:active{transform:scale(.985)}
.num{display:block;margin-bottom:11px;color:#7d7d88;font-size:11px;font-weight:700;letter-spacing:.18em}
.title{display:block;font-size:clamp(22px,6vw,31px);line-height:1.05;font-weight:820;letter-spacing:-.04em;word-break:keep-all}
.desc{display:block;margin-top:7px;color:#9999a4;font-size:13px}
.arrow{flex:0 0 auto;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.045);font-size:20px}
footer{margin-top:26px;color:#686872;font-size:11px;text-align:center;letter-spacing:.08em}
@media(max-width:520px){.page{justify-content:flex-start;padding-top:64px}.choices{margin-top:30px}.choice{min-height:108px;border-radius:22px}}
</style>
</head>
<body>
<main class="page">
  <div class="eyebrow"><span class="dot"></span>pick one</div>
  <h1>오늘은<br><span class="accent">뭘 볼래?</span></h1>
  <p class="sub">마음 가는 걸 하나 눌러. 바로 YouTube로 이동해.</p>
  <section class="choices">
    <a class="choice lucario" href="https://www.youtube.com/watch?si=vc9qFAJnZoR7jM8O&v=STsNhKHzPWE&feature=youtu.be">
      <span><span class="num">01</span><span class="title">루카리오♡</span><span class="desc">YouTube에서 바로 보기</span></span>
      <span class="arrow">↗</span>
    </a>
    <a class="choice taeyeon" href="https://www.youtube.com/watch?v=L1ivI9uUdpc">
      <span><span class="num">02</span><span class="title">태연아 이거꼭봐</span><span class="desc">YouTube에서 바로 보기</span></span>
      <span class="arrow">↗</span>
    </a>
  </section>
  <footer>tap · watch · enjoy ♡</footer>
</main>
</body>
</html>
