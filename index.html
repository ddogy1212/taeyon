<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영상 보기 ♡</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f6, #f3efff, #eef7ff);
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: min(720px, 100%);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      padding: 34px;
      box-shadow: 0 18px 50px rgba(68, 43, 90, 0.13);
      text-align: center;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    a {
      display: block;
      text-decoration: none;
      border-radius: 20px;
      padding: 20px 16px;
      font-size: clamp(1.05rem, 3vw, 1.25rem);
      font-weight: 800;
      color: white;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.13);
    }

    a:active {
      transform: scale(0.98);
    }

    .lucario {
      background: #ff8fc7;
    }

    .taeyeon {
      background: #8f9cff;
    }

    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      .container {
        padding: 24px 18px;
        border-radius: 22px;
      }

      a {
        padding: 18px 14px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>보고 싶은 거 눌러 😼💗</h1>

    <div class="buttons">
      <a
        class="lucario"
        href="https://www.youtube.com/watch?si=vc9qFAJnZoR7jM8O&v=STsNhKHzPWE&feature=youtu.be"
      >
        루카리오♡
      </a>

      <a
        class="taeyeon"
        href="https://www.youtube.com/watch?v=L1ivI9uUdpc"
      >
        태연아 이거꼭봐
      </a>
    </div>
  </main>
</body>
</html>
